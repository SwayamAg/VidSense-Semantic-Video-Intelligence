version: '3.8'

services:
  yt-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    volumes:
      # Persist FAISS indices across container rebuilds
      - ./faiss_index:/app/faiss_index
    restart: unless-stopped
